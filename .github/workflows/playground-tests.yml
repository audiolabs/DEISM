name: Playground engine tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Pull-request updates supersede older runs. Main pushes use the commit SHA so
# every merged commit receives its own complete verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  playground:
    name: Playground engine golden tests
    runs-on: ubuntu-latest

    steps:
      # No LFS checkout: the sampled-directivity MAT files (194 MB) come from
      # the GitHub release assets below, cached between runs, so CI does not
      # spend Git LFS bandwidth. The checkout leaves LFS pointer files, which
      # the downloader treats as missing and replaces.
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenGL libraries for gmsh
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa libgl1

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --editable . pytest

      - name: Restore cached directivity datasets
        uses: actions/cache@v4
        with:
          path: examples/data/sampled_directivity
          key: directivity-${{ hashFiles('playground/catalog.json') }}

      - name: Download missing directivity datasets from the release assets
        run: |
          python - <<'PY'
          from deism import playground_datasets as d
          directory = "examples/data/sampled_directivity"
          catalog = d.load_catalog()
          # All 20 files, not only the supported ones: the catalog tool below
          # scans every MAT file in the directory, LFS pointers included.
          keys = d.missing_keys(directory, catalog, supported_only=False)
          print(f"{len(keys)} file(s) to fetch from {d.DATASET_BASE_URL}")
          d.download(directory, catalog, keys, progress=print)
          status = d.inspect(directory, catalog, supported_only=False)
          assert status.complete, status.missing
          PY

      - name: Regenerate fixtures and datasets from the Python solver
        run: |
          python tools/playground_fixtures.py
          python tools/playground_directivity.py
          git diff --stat -- playground/fixtures

      - name: Run Python tests that need original MAT datasets
        run: python -m pytest -o addopts= -m directivity_data --require-directivity-data

      - name: Verify preset geometry and solves against the example scripts
        run: python -m pytest tests/test_playground_presets_examples.py -q --require-directivity-data

      - name: Run the JavaScript golden tests
        run: cd playground && npm test

      - name: Build the demo page
        run: |
          python tools/playground_build.py --out /tmp/demo.html
